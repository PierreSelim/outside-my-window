[project]
name = "outside-my-window"
version = "0.1.0"
description = "Outside My Window (weather observation visualization)"
requires-python = ">=3.13"
dependencies = [
    "dash>=4.1.0",
    "plotly>=6.6.0",
    "polars>=1.39.3",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
