[project]
name = "outside-my-window"
version = "0.1.0"
description = "Outside My Window (weather observation visualization)"
requires-python = ">=3.13"
dependencies = [
    "dash>=4.1.0",
    "plotly>=6.6.0",
    "polars>=1.39.3",
    "requests>=2.33.1",
    "waitress>=3.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "mypy>=1.16.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
# warn_return_any disabled: go.Figure / html.Div resolve to Any (no plotly/dash stubs)
warn_return_any = false
